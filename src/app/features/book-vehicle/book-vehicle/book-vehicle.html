<div class="space-y-4">
  <section class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100 sm:text-2xl">Book Vehicle</h2>
      <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">
        Create a rental booking with live bill preview.
      </p>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <app-background-refresh [visible]="isRefreshing()" />
      <span
        class="inline-flex w-fit items-center gap-2 rounded-full border border-cyan-200 bg-cyan-50 px-3 py-1 text-xs font-semibold text-cyan-700 dark:border-cyan-500/30 dark:bg-cyan-500/10 dark:text-cyan-300"
      >
        <ng-icon name="heroClipboardDocumentList" class="size-3.5" />
        New booking
      </span>
    </div>
  </section>

  @if (isInitialLoading()) {
    <div
      class="overflow-hidden rounded-2xl border border-white/80 bg-white shadow-lg shadow-slate-200/60 dark:border-white/10 dark:bg-surface-900 dark:shadow-black/20"
    >
      <div class="grid lg:grid-cols-[minmax(0,320px)_1fr]">
        <div class="border-b border-slate-100 bg-slate-100 p-6 dark:border-white/10 dark:bg-white/5 lg:border-b-0 lg:border-r">
          <div class="h-48 animate-pulse rounded-2xl bg-slate-200 dark:bg-white/10"></div>
        </div>
        <div class="space-y-4 p-6">
          @for (row of [1, 2, 3, 4]; track row) {
            <div class="h-10 animate-pulse rounded-xl bg-slate-100 dark:bg-white/10"></div>
          }
        </div>
      </div>
    </div>
  } @else if (loadError(); as error) {
    <div
      class="flex flex-col gap-3 rounded-2xl border border-rose-200 bg-rose-50 p-4 sm:flex-row sm:items-center sm:justify-between dark:border-rose-500/30 dark:bg-rose-500/10"
    >
      <div class="flex min-w-0 items-start gap-3">
        <ng-icon name="heroExclamationCircle" class="mt-0.5 size-5 shrink-0 text-rose-600 dark:text-rose-400" />
        <div class="min-w-0">
          <p class="text-sm font-semibold text-rose-800 dark:text-rose-300">Failed to load booking data</p>
          <p class="mt-1 text-sm text-rose-700 dark:text-rose-400">{{ error }}</p>
        </div>
      </div>
      <button
        type="button"
        class="inline-flex min-h-9 shrink-0 items-center justify-center rounded-lg border border-rose-300 bg-white px-3 py-1.5 text-sm font-semibold text-rose-700 transition hover:bg-rose-100 dark:border-rose-500/30 dark:bg-transparent dark:text-rose-300 dark:hover:bg-rose-500/10"
        (click)="loadData()"
      >
        Retry
      </button>
    </div>
  } @else if (!canShowForm()) {
    <app-empty-state
      icon="heroTruck"
      title="No vehicles available"
      message="Add vehicles to your fleet before creating a booking."
    />
  } @else {
    <app-book-vehicle-form
      [cars]="carService.cars()"
      [customers]="customerService.customers()"
      [isSubmitting]="isSubmitting()"
      (submitted)="onSubmit($event)"
      (cancelled)="onCancel()"
    />
  }
</div>
