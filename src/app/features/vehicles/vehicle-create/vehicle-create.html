<div class="space-y-4">
  <section class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0 space-y-2">
      <a
        routerLink="/vehicles"
        class="inline-flex w-fit items-center gap-1.5 text-sm font-medium text-slate-500 transition hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400"
      >
        <ng-icon name="heroArrowLeft" class="size-4" />
        Back to vehicles
      </a>

      <div class="flex items-center gap-3">
        <div
          class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-indigo-500 via-violet-500 to-cyan-400 shadow-md shadow-indigo-500/30"
        >
          <ng-icon name="heroPlus" class="size-5 text-white" />
        </div>
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-slate-900 dark:text-slate-100 sm:text-xl">Add vehicle</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">
            Register a new car in your fleet.
          </p>
        </div>
      </div>
    </div>

    <span
      class="inline-flex w-fit shrink-0 items-center gap-2 rounded-full border border-indigo-200 bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700 dark:border-indigo-500/30 dark:bg-indigo-500/10 dark:text-indigo-300"
    >
      <ng-icon name="heroTruck" class="size-3.5" />
      New fleet entry
    </span>
  </section>

  <app-vehicle-form
    submitLabel="Create vehicle"
    [isSubmitting]="isSubmitting()"
    (submitted)="onSubmit($event)"
    (cancelled)="onCancel()"
  />
</div>
