<div class="space-y-4">
  <section class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0 space-y-2">
      <a
        routerLink="/customer-ledger"
        class="inline-flex w-fit items-center gap-1.5 text-sm font-medium text-slate-500 transition hover:text-violet-600 dark:text-slate-400 dark:hover:text-violet-400"
      >
        <ng-icon name="heroArrowLeft" class="size-4" />
        Back to ledger
      </a>

      <div class="flex items-center gap-3">
        <div
          class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-linear-to-br from-violet-500 via-fuchsia-500 to-indigo-500 shadow-md shadow-violet-500/30"
        >
          <ng-icon name="heroPlus" class="size-5 text-white" />
        </div>
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-slate-900 dark:text-slate-100 sm:text-xl">Add customer</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">
            Register a new customer in the ledger.
          </p>
        </div>
      </div>
    </div>

    <span
      class="inline-flex w-fit shrink-0 items-center gap-2 rounded-full border border-violet-200 bg-violet-50 px-3 py-1 text-xs font-semibold text-violet-700 dark:border-violet-500/30 dark:bg-violet-500/10 dark:text-violet-300"
    >
      <ng-icon name="heroUsers" class="size-3.5" />
      New customer
    </span>
  </section>

  <app-customer-form
    submitLabel="Create customer"
    [isSubmitting]="isSubmitting()"
    (submitted)="onSubmit($event)"
    (cancelled)="onCancel()"
  />
</div>
